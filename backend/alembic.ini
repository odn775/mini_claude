# NOTE: keep this file ASCII-only. Python's configparser reads it with the
# system locale encoding (GBK on zh-CN Windows), so non-ASCII comments break it.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# The URL is injected by alembic/env.py from backend/.env (DATABASE_URL),
# so it is intentionally left empty here to avoid duplicating the setting.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
